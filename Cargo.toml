[package]
name = "openarcadia"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Open infrastructure toolkit for content deployment, protocol analysis, WAD archives, and realm simulation"
repository = "https://github.com/cybellereaper/o101"

[dependencies]
crc32fast = "1"
ctrlc = { version = "3", features = ["termination"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
